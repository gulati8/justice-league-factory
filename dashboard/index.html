<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justice League Factory — Mission Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>JUSTICE LEAGUE FACTORY</h1>
    <div id="status" class="status idle">IDLE</div>
  </header>

  <div id="agents-bar" class="agents-bar">
    <div class="agent-chip" data-agent="batman"><span class="chip-icon">🦇</span><span class="chip-name">Batman</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="martian-manhunter"><span class="chip-icon">👽</span><span class="chip-name">Martian Manhunter</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="cyborg"><span class="chip-icon">🤖</span><span class="chip-name">Cyborg</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="wonder-woman"><span class="chip-icon">⚔️</span><span class="chip-name">Wonder Woman</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="flash"><span class="chip-icon">⚡</span><span class="chip-name">The Flash</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="green-lantern"><span class="chip-icon">💚</span><span class="chip-name">Green Lantern</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="lois-lane"><span class="chip-icon">📝</span><span class="chip-name">Lois Lane</span><span class="chip-status">--</span></div>
    <div class="agent-chip" data-agent="oracle"><span class="chip-icon">🔮</span><span class="chip-name">Oracle</span><span class="chip-status">--</span></div>
  </div>

  <div class="pagination-toolbar">
    <button id="btn-newer" disabled>&#8593; Newer</button>
    <span id="page-indicator" class="page-indicator">Page 1 of 1</span>
    <button id="btn-older" disabled>Older &#8595;</button>

    <div class="toolbar-sep"></div>

    <span class="filter-label">From</span>
    <input id="filter-from" class="filter-input" type="datetime-local">
    <span class="filter-label">To</span>
    <input id="filter-to" class="filter-input" type="datetime-local">
    <button id="btn-filter">Filter</button>
    <button id="btn-clear">Clear</button>
  </div>

  <main id="log-viewer">
    <div id="log-entries">
      <div class="log-row system-row">
        <span class="log-ts">--:--:--</span>
        <span class="log-type">system</span>
        <span class="log-agent">--</span>
        <span class="log-detail">Justice League Factory initialized. Waiting for mission...</span>
      </div>
    </div>
  </main>

  <!-- Transcript overlay -->
  <div id="transcript-overlay" class="transcript-overlay hidden">
    <div class="transcript-panel">
      <div class="transcript-header">
        <h3 id="transcript-title">Transcript</h3>
        <button id="transcript-close" class="transcript-close">&times;</button>
      </div>
      <div class="transcript-meta" id="transcript-meta"></div>
      <pre id="transcript-content" class="transcript-content"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
